- aid: naesb:naesb-eir-webregistry
  name: NAESB Electric Industry Registry (EIR) webRegistry Web Services
  description: >-
    The NAESB Electric Industry Registry is the central repository of registry information
    used by the North American wholesale electric industry for electronic tagging; it replaced
    the NERC TSIN in 2012 and is administered for NAESB by Open Access Technology
    International (OATI) as OATI webRegistry. It exposes a documented SOAP 1.1 web service
    with methods including DownloadEntity, DownloadBA, DownloadPSE and DownloadACA, described
    across the 121-page OATI webRegistry Technical Guide v6.1. The service is HTTPS-only, and
    per section 2.5 of that guide no request is processed unless it carries a digitally signed
    certificate associated with a registered webRegistry user; those certificates are issued
    by NAESB-Authorized Certification Authorities. Access also requires a paid registry
    subscription. The full WSDL — one service, one portType and thirty Download* operations
    over thirty entity structs — IS served to anonymous callers and is harvested here
    verbatim. Two things complicate reaching it: the server certificate is issued by OATI's
    private "webCARES Server Issuing CA 2025" and does not chain to a public root, so default
    trust stores fail verification (curl exit 60); and once that is accounted for, an
    anonymous SOAP call returns HTTP 200 with ReturnCode 1 / FAILURE and the message "Please
    present a valid certificate that is associated with a NAESB EIR user". The contract is
    public; the data behind it is not.
  humanURL: https://www.naesb.org/weq/weq_eir.asp
  baseURL: https://www.naesbwry.oati.com/cgi-bin/webplus.dll?Script=/naesbwry/WREG-Web-Services-Main.wml
