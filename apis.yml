enrichment:
  round: '2026-07-27'
  note: >-
    Contract discovery upgraded this repo. The prior round recorded that the EIR webRegistry
    endpoint could not complete a TLS handshake anonymously. That was a trust-chain failure,
    not a handshake failure: the server certificate is issued by OATI's private webCARES
    Server Issuing CA and does not chain to a public root. Once that is accounted for, the
    host answers, the full 30-operation WSDL is served to anonymous callers, and the service
    returns a well-formed SOAP refusal ("Please present a valid certificate that is
    associated with a NAESB EIR user") rather than nothing at all. The WSDL is now harvested
    verbatim and is this provider's real machine-readable contract.
apis:
- aid: naesb:naesb-espi-green-button
  name: NAESB REQ.21 Energy Services Provider Interface (ESPI)
  description: >-
    The NAESB REQ.21 ESPI Model Business Practices define the data exchange protocol for
    transferring retail energy usage information from a utility (Data Custodian) to a Third
    Party with the Retail Customer's authorization. ESPI is the industry-consensus standard
    that is the basis of every Green Button implementation in North America and is the
    standard endorsed by the Green Button Alliance. NAESB publishes the standard; it does not
    operate an ESPI endpoint — each Data Custodian utility hosts its own, so there is no
    NAESB base URL. The Atom/XML payload schemas (NAESBespiSchema.xsd and retailcustomer.xsd,
    v3.3 and v4.0) are released under the Apache License 2.0 as a one-time exception to the
    NAESB Copyright Policy and are harvested here verbatim. The narrative Model Business
    Practices themselves are copyright-protected and must be purchased or obtained through
    NAESB membership. The v4.0 schema encodes an OAuth 2.0 authorization model directly —
    ApplicationInformation carries authorizationServerAuthorizationEndpoint,
    authorizationServerTokenEndpoint, authorizationServerRegistrationEndpoint, GrantType,
    TokenEndPointMethod, scope and OAuthError.
  humanURL: https://www.naesb.org/ESPI_Standards.asp
