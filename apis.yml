name: NAESB
kind: company
description: >-
  The North American Energy Standards Board (NAESB) is the non-profit, industry-consensus
  standards development organization formed in 1994 that writes the business practice
  standards for the North American wholesale and retail natural gas and electricity markets,
  organized into four quadrants — Wholesale Electric (WEQ), Retail Electric (REQ), Wholesale
  Gas (WGQ) and Retail Gas (RGQ). Headquartered in Houston, Texas, its home market is the
  United States (with Canadian and Mexican participation). NAESB sits upstream of every
  utility, ISO/RTO and energy-data platform in the value chain: it authors REQ.21 Energy
  Services Provider Interface (ESPI), the standard that is the basis of every Green Button
  implementation in North America, and it operates the NAESB Electric Industry Registry
  (EIR) that underpins electronic tagging across the wholesale electric market. Its API
  posture is deliberately split and must not be overstated. NAESB is not a data holder and
  no consumer-data mandate applies to it; the Green Button standard it publishes is adopted
  by US utilities purely voluntarily, with no federal obligation behind it. The
  specifications themselves are copyright-protected and paywalled — $8,000/year membership,
  $2,000 per quadrant version, or $250 per individual standard — with only a free,
  view-only, three-business-day evaluation waiver for non-members. The single genuinely open
  artifact is the set of ESPI XML schemas, released under Apache 2.0 as a documented one-time
  exception to the NAESB Copyright Policy and downloadable anonymously after a one-click
  terms-of-use acknowledgement. The one real API NAESB operates, the EIR webRegistry SOAP
  service administered by OATI, is closed: it requires a paid registry subscription and a
  digitally signed X.509 certificate issued by an NAESB-Authorized Certification Authority,
  and its endpoint could not even complete a TLS handshake anonymously. Open standard
  schemas, closed standards text, closed registry API, no consumer data and no open market
  data of its own.
