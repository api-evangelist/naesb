      TaggingEntityID for participants and TaggingPointID for points — these are the join keys
      used across adjacency and path records, not the local ID.
    external_keys:
    - NERCID
    - DUNS
    effective_dating: >-
      Almost every entity carries StartEffectiveDate and StopEffectiveDate, and participant
      roles additionally carry ExpirationDate. The graph is bitemporal in practice: a read is
      scoped by the EffectiveDate request parameter and by the registry publication Version.
  entities:
  - name: EntityStruct
    operation: DownloadEntity
    role: the root market participant record
    key_fields: [ID, Entity_Type, NERCID, DUNS, ShortName, LongName, EntityCodeRole, TaggingEntityID]
  - name: BAStruct
    operation: DownloadBA
    role: Balancing Authority
    key_fields: [ID, Code, EntityName, ReliabilityAreaName, ReliabilityRegionName, MarketAreaName, InterconnectionName, TaggingEntityID]
  - name: PSEStruct
    operation: DownloadPSE
    role: Purchasing-Selling Entity
    key_fields: [ID, Code, EntityName, PSEType, ReliabilityRegionName, TaggingEntityID]
  - name: TSPStruct
    operation: DownloadTSP
    role: Transmission Service Provider
    key_fields: [ID, Code, EntityName, ReliabilityRegionName, TaggingEntityID]
  - name: RCStruct
    operation: DownloadRC
    role: Reliability Coordinator
