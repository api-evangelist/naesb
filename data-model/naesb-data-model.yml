    key_fields: [authorizationServerUri, authorizationServerAuthorizationEndpoint, authorizationServerTokenEndpoint, authorizationServerRegistrationEndpoint, GrantType, TokenEndPointMethod, scope, dataCustodianApplicationStatus]
  - name: Authorization
    role: the retail customer's grant of access to a third party
    key_fields: [authorizedPeriod, scope, error, status]
  - name: UsagePoint
