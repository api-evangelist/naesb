  wsdl/naesb-eir-webregistry.wsdl (30 *Struct type definitions), schemas/naesb-espi_v4.xsd,
  schemas/naesb-customer_v4.xsd
summary: >-
  Two disjoint entity graphs. The EIR webRegistry models the North American wholesale
  electric market as registered market participants (entities holding coded roles), the
  physical and commercial points they schedule across, and the adjacency edges that make
  e-tag paths valid. The ESPI graph models retail energy usage: a usage point, its meter
  readings, the interval blocks under them, and the OAuth authorization that lets a third
  party read them. They share no keys.
domains:
