summary: No official hosted or remote Model Context Protocol (MCP) server was found for NAESB, and none
  is advertised on naesb.org or by OATI, the registry administrator. The candidate tool set below is DERIVED
  one-to-one from the 30 operations in the EIR webRegistry WSDL as a proposal for an agent-facing surface.
  It is not published by NAESB. Every tool is read-only, and every tool would require the caller to hold
  an X.509 client certificate issued by a NAESB-Authorized Certification Authority plus a paid EIR subscription,
  so an unattended agent cannot use this surface without provisioned registry credentials.
