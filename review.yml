aid: naesb
name: NAESB
review:
  question: >-
    Does the North American Energy Standards Board publish a genuine public API or
    machine-readable specification surface, and how much of the Green Button / ESPI
    standard it authors is actually free and public?
  answer: partial
  date: '2026-07-27'
  reviewer: API Evangelist
  tier: industry-body-standards
  homeMarket: United States
  summary: >-
    NAESB is a standards development organization, not a service operator. It publishes one
    genuinely open machine-readable artifact — the REQ.21 ESPI (Green Button) XML schemas
    under Apache 2.0 — and operates exactly one real API, the EIR webRegistry SOAP service,
    which is completely closed behind a paid subscription and an accredited-CA client
    certificate. The narrative standards themselves are paywalled. There is no consumer data
    API and no open market data.

mandate:
  regime: green-button-voluntary
  status: not-applicable
  verbatim: >-
    NAESB is the AUTHOR of the Green Button standard, not a party subject to a data mandate.
    No federal US obligation compels any utility to implement Green Button, and no
    consumer-data obligation applies to NAESB itself because NAESB holds no customer data.
    The ESPI standards page states plainly that "The Green Button Initiative was launched in
    2011 by the White House Office of Science and Technology Policy" and that "The utility
    industry responded" — an initiative and an industry response, not a mandate. The regime
    in play around this organization is therefore green-button-voluntary; the organization's
    own implementation status is not-applicable.
  isDataHolder: false
  authorsStandard: true
  claimVsImplementation: >-
    NAESB makes no compliance claim about itself. It does state, on
    https://www.naesb.org/ESPI_Standards.asp, that "energy usage data is now made available
    through the Green Button to 60 million U.S. households, altogether 100 million people, and
    nearly 3 million customers in Canada." That is an industry adoption claim published by the
    standards body about third parties. It is NOT verified here and is NOT an implementation
    by NAESB. Per-utility Green Button implementation must be verified utility by utility, at
    the utility's own endpoint. NAESB itself operates no ESPI endpoint.
  certificationIsNotImplementation: >-
    NAESB runs certification programmes but does NOT certify Green Button / ESPI
    implementations — that is done by the Green Button Alliance under a separate collaborative
    arrangement. NAESB's own public certified-products directory
    (https://www.naesb.org/pdf2/cert_products.pdf, updated January 2026) lists ZERO certified
    products under "WEQ OASIS SC&P Certified" and exactly three under "WGQ Version 4.0
    Certified": Emerson O2CManager Software for Gas Pipelines v8.0 (certified 2025-01-30,
    expires 2027-01-30), Quorum Software myQuorum Pipeline (CAW) and IPWS (certified
    2025-10-09, expires 2027-10-09), and Enercross LLC NatGasHub.com (certified 2025-10-06,
    expires 2027-10-06). A registry of three certified gas products is the full extent of the
    publicly verifiable certification directory.

dataStandard:
  primary: NAESB REQ.21 Energy Services Provider Interface (ESPI) v4.0 — the Green Button standard
  publisherRole: NAESB is the publisher/author of this standard, not an implementer of it.
  versionsHarvested:
  - version: 3.3.20200320
    file: schemas/naesb-espi.xsd
    targetNamespace: http://naesb.org/espi
    note: >-
      REQ.21 ESPI Model Business Practices, Retail Markets Quadrant (RMQ), Version 3.3
      published January 30, 2020, MC20001 applied effective March 20, 2020.
  - version: 3.3.20200130
    file: schemas/naesb-customer.xsd
    targetNamespace: http://naesb.org/espi/customer
  - version: 4.0.20231213
    file: schemas/naesb-espi_v4.xsd
    targetNamespace: http://naesb.org/espi
    note: Version 4.0, published December 2023. Current version.
  - version: 4.0.20231213
    file: schemas/naesb-customer_v4.xsd
    targetNamespace: http://naesb.org/espi/customer
  otherStandardsPublished:
  - NAESB WEQ — Wholesale Electric Quadrant Business Practice Standards (includes OASIS
    Standards & Communication Protocols, WEQ-012 Public Key Infrastructure, WEQ-013 EIR
    webRegistry)
  - NAESB REQ / RMQ — Retail Electric Quadrant (includes REQ.21 ESPI)
  - NAESB WGQ — Wholesale Gas Quadrant Business Practice Standards (Version 4.0 current for
    certification)
  - NAESB RGQ — Retail Gas Quadrant Business Practice Standards
  - NAESB model contracts, e.g. Base Contract for Sale and Purchase of Natural Gas 6.3.1 and
    the Base Contract for Sale and Purchase of Hydrogen 6.3.6 (dated November 24, 2025)
  standardsFreelyDownloadable: false
  schemasFreelyDownloadable: true
  schemaLicence: >-
    Apache License, Version 2.0. Stated verbatim on the ESPI page: "the NAESB Board of
    Directors have provided a one-time exception to the NAESB Copyright Policy for the schemas
    contained within the copyright protected ESPI Model Business Practices to the industry
    under the Apache 2.0 license." The terms-of-use interstitial repeats it: "This license
    does not attach to the entire ESPI Model Business Practices themselves, only the schemas
    contained therein." The Apache 2.0 header is present inside each harvested .xsd file.

consumerVsMarketData:
  consumer_data_api: false
  consumer_data_note: >-
    NAESB exposes no API through which a third party can obtain any individual customer's
    usage or billing data. It defines the protocol by which utilities do that (Data Custodian
    → Third Party, with Retail Customer authorization) but holds no customer data itself. Any
    real ESPI/Green Button consumer data API is hosted by the individual utility, not by NAESB.
  market_data_open: false
  market_data_note: >-
    NAESB publishes no open grid, market or system data feed of its own. The one data asset it
    controls — the Electric Industry Registry, the central repository for electronic tagging
    information used by the wholesale electric market — is subscription- and certificate-gated
    with no anonymous access whatsoever. The only artifacts anyone can retrieve anonymously
    are the four Apache-2.0 ESPI XML schemas and a handful of PDF directories (certified
    products, Authorized Certification Authorities, membership statistics). Those are
    specifications and registries of vendors, not market data.
  theSplit: >-
    The finding for this organization is not an open/closed split across two data speeds — it
    is closed on both. The real split is between the SCHEMA and the STANDARD: NAESB gave away
    the machine-readable XSDs under Apache 2.0 so that Green Button tooling could exist, while
    keeping the human-readable Model Business Practices that explain how to use them behind an
    $8,000/year membership or a $250 per-document purchase. You can parse a Green Button file
    for free; you cannot read the rules for free.

accessGate:
  gate: accredited-only
  gated: true
  whatADeveloperMustDo:
    forTheEspiSchemas: >-
      Nothing but click. Visit https://www.naesb.org/ESPI_Standards.asp, follow one of the
      four schema links to
      https://www.naesb.org/termsofuse_form.asp?doc={espi|customer|espi_v4|customer_v4}.xsd,
      and click a single "I Agree" button (the form has exactly one input, a submit button —
      no name, email, or registration field). That posts to
      https://www.naesb.org/termsofuse_send.asp?doc=... which returns the raw XSD as
      Content-Type text/xml. Verified anonymously on 2026-07-27, all four returned HTTP 200.
    forTheStandardsThemselves: >-
      Pay. Per https://www.naesb.org/ESPI_Standards.asp and the Materials Order Form: NAESB
      membership is $8,000/year (members download everything free); an individual version of
      one quadrant's full standards set is $2,000 (USB, mail order only); an individual
      standard, final action, or manual is $250 (e-mail delivery only). A free non-member
      evaluation waiver exists but is severely limited — per
      https://www.naesb.org//misc/NAESB_Nonmember_Evaluation.pdf it "extends for three
      business days", "cannot be repeated for a given company and requested set of standards",
      is "granted for evaluation or commenting purposes only", is delivered through a
      LockLizard DRM secure viewer, and "the access is restricted to viewing – it does not
      extend to printing or copying". It requires contacting the NAESB office by phone or
      e-mail; there is no self-serve route.
    forTheEirWebRegistryApi: >-
      Three things, in order. (1) Register as an EIR user and pay the registry subscription —
      per https://www.naesb.org/pdf4/naesb_eir_subscription_fee010715.docx the initial
      registration subscription fee is $300 and the yearly renewal is $200 (2015 notice, most
      recent published fee schedule found). (2) Obtain a digital certificate from one of the
      NAESB Independent Authorized Certification Authorities listed at
      https://www.naesb.org/pdf4/ac_authorities_2023.pdf — currently OATI, Systrends, GMO
      GlobalSign Inc. and SSL Corp. d/b/a SSL.com. (3) Have that certificate associated with
      your webRegistry user. There is no signup form, no API key, no sandbox and no
      self-serve tier.
  noDeveloperPortal: >-
    There is no developer portal in the conventional sense. The closest public, anonymous,
    machine-readable surface is the ESPI standards page.

authModel:
  eirWebRegistry:
    scheme: mTLS / X.509 client certificate issued by an NAESB-Authorized Certification Authority
    protocol: SOAP 1.1 over HTTPS only
    verbatimFromTechnicalGuide: >-
      Section 2.5 Security of the OATI webRegistry Technical Guide v6.1: "the web service
      location is hosted on a secure server and only HTTPS protocol will be allowed. Second,
      before any action is taken on any web service request, a digitally signed certificate
      that has been successfully associated with a webRegistry User must be provided. Only
      requests accompanied with the appropriate certificate will be processed."
    wsdl: >-
      Section 2.2 Location states "The same URL can be accessed to get the WSDL content, by
      submitting a regular HTTP GET request." That WSDL could NOT be retrieved anonymously —
      see the probe result below. No WSDL is stored in this repo because none was obtained.
    accreditationLayer: >-
      NAESB runs a Certification Program for Accredited Certification Authorities; the ACA
      directory is public at https://www.naesb.org/pdf4/ac_authorities_2023.pdf and lists four
      ACAs (OATI, Systrends, GMO GlobalSign Inc., SSL Corp. d/b/a SSL.com) as of the March 2026
      supporting-document updates recorded in that PDF.
  espiStandard:
    scheme: OAuth 2.0, encoded directly into the published XML schema
    evidence: >-
      Harvested from schemas/naesb-espi_v4.xsd itself (not from marketing copy). The
      ApplicationInformation and Authorization types declare
      authorizationServerAuthorizationEndpoint, authorizationServerTokenEndpoint,
      authorizationServerRegistrationEndpoint, authorizationServerUri, authorizationURI,
      authorizedPeriod, dataCustodianScopeSelectionScreenURI, thirdPartyScopeSelectionScreenURI,
      scope, GrantType, TokenType, TokenEndPointMethod, AuthorizationStatus and OAuthError.
      The presence of a registration endpoint indicates dynamic client registration is part of
      the model. Actual scope VALUES are utility-specific and are not enumerated in the schema,
      so none are recorded here.
    note: >-
      NAESB does not operate an authorization server. This is the auth model the standard
      REQUIRES of implementing Data Custodians. No NAESB OAuth or OpenID Connect endpoint
      exists.
  naesbOrgItself:
    scheme: none
    note: >-
      https://www.naesb.org/.well-known/openid-configuration returned HTTP 404 on 2026-07-27.
      No OpenID Connect discovery document, no security.txt, no robots.txt, no sitemap.xml.

