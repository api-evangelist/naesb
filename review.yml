standardsBodyProfile:
  founded: 1994
  legalForm: Non-profit standards development organization
  headquarters: 1415 Louisiana, Suite 3460, Houston, Texas 77002
  charterVerbatim: >-
    "The North American Energy Standards Board (NAESB) serves as an industry forum for the
    development and promotion of standards which will lead to a seamless marketplace for
    wholesale and retail natural gas and electricity."
  quadrants:
  - WEQ — Wholesale Electric Quadrant
  - REQ / RMQ — Retail Electric (Retail Markets) Quadrant
  - WGQ — Wholesale Gas Quadrant
  - RGQ — Retail Gas Quadrant
  membershipCounts:
    asOf: '2026-07-23'
    source: https://www.naesb.org/pdf4/memstats.pdf
    WGQ: 112
    WEQ: 126
    RMQ: 32
  fundingModel: >-
    Stated by NAESB itself: "the organization is funded by its voluntary members and through
    the sale of its copyright protected standards and work products, including the ESPI Model
    Business Practices." This is why the standards are paywalled — the paywall IS the funding
    model, and it is the direct reason a public-interest standard like Green Button is not
    freely readable.
  certificationProgrammes:
  - name: Certification Program for Standards
    scope: Software products certified compliant with WEQ OASIS S&CP (versions 1.0–2.2) and WGQ (versions 1.4–4.0)
    publicDirectory: https://www.naesb.org/pdf2/cert_products.pdf
    validity: Two years
    currentlyCertified:
    - 'WEQ OASIS S&CP: none'
    - 'WGQ Version 4.0: Emerson O2CManager Software for Gas Pipelines v8.0 (2025-01-30 → 2027-01-30)'
    - 'WGQ Version 4.0: Quorum Software myQuorum Pipeline (CAW) and IPWS (2025-10-09 → 2027-10-09)'
    - 'WGQ Version 4.0: Enercross LLC NatGasHub.com (2025-10-06 → 2027-10-06)'
  - name: Certification Program for Accredited Certification Authorities
    publicDirectory: https://www.naesb.org/pdf4/ac_authorities_2023.pdf
    currentlyAccredited:
    - Open Access Technology International, Inc. (OATI)
    - Systrends (processing certificates in partnership with GMO GlobalSign Inc.)
    - GMO GlobalSign Inc.
    - SSL Corp. d/b/a SSL.com
  - name: Certification Program for Energy Efficiency Measurement and Verification Services or Products
    publicDirectory: none found
  - name: Certification Program for Third Party Data Privacy Practices
    publicDirectory: none found
    note: Directly relevant to Green Button third parties; no public list of certified entities was found.
  - name: FERC eForms Vendors Certification (pending)
    publicDirectory: https://www.naesb.org/pdf4/potential_ferc_fsv_2020.pdf
    note: Programme under development; the PDF is an informal list of potential vendors, not certifications.
  howMuchIsPublic: >-
    Materially little, and the boundary is sharp. Public and anonymous: the ESPI XML schemas
    (Apache 2.0), the certified-products directory, the ACA directory, the membership
    statistics, meeting calendars, press releases and white paper listings. Not public: every
    business practice standard in all four quadrants, the ESPI Model Business Practices
    narrative, and the EIR registry and its API. NAESB is unusual among standards bodies in
    having deliberately carved out the machine-readable part of one standard and released it
    openly while keeping everything else paid — a targeted concession made specifically to
    keep Green Button tooling viable, in exchange for the Green Button Alliance ensuring its
    certification participants hold valid NAESB access.

relatedOrganizations:
  - name: Green Button Alliance (GBA)
    relationship: >-
      Separate non-profit, formed 2015. Endorses and supports REQ.21 ESPI and runs the Green
      Button certification/testing programme. NAESB and GBA have a stated collaborative working
      relationship. NAESB's Apache 2.0 schema exception was granted "Through an arrangement with
      the GBA". GBA — not NAESB — certifies Green Button implementations.
  - name: Open Access Technology International, Inc. (OATI)
    relationship: >-
      NAESB's chosen system administrator for the Electric Industry Registry since 2012, when
      the NAESB EIR replaced the NERC TSIN. Operates the registry as OATI webRegistry, authors
      the technical guide, and is also an NAESB-Authorized Certification Authority.
  - name: US Department of Energy / NIST / White House OSTP
    relationship: >-
      Supported the 2011 development of the ESPI Model Business Practices; OSTP launched the
      Green Button Initiative the same year. Support and initiative, not statutory mandate.

notFound:
  - No OpenAPI, Swagger, RAML, or Postman collection anywhere on naesb.org.
  - No WSDL retrievable — the documented WSDL GET requires the registry PKI to complete TLS.
  - No REST API of any kind operated by NAESB.
  - No open data portal, no CSV/JSON bulk downloads, no data licence page.
  - No developer, docs, api or data subdomain (all NXDOMAIN).
  - No confirmed NAESB LinkedIn company page (both /naesb and /north-american-energy-standards-board returned 404).
  - >-
    A GitHub account at github.com/NAESB exists but is a personal USER account (type User,
    created 2025-04-28, one public repo, no name, bio, company, blog or verified affiliation).
    It is NOT recorded as NAESB's GitHub presence because the affiliation cannot be verified.

actions:
  schemasHarvested: 4
  schemasDirectory: schemas/
  openapiHarvested: false
  openapiDirectory: null
  apisYmlCreated: true
  readmeCreated: true
  reason: >-
    Four real, verbatim, Apache-2.0-licensed XML Schema documents were harvested and all four
